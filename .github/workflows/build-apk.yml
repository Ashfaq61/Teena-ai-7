name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          JAVA_VER_OUTPUT="$(java -version 2>&1)"
          echo "$JAVA_VER_OUTPUT"

          RAW_VERSION="$(printf '%s\n' "$JAVA_VER_OUTPUT" | head -n 1 | sed -nE 's/.*version "([^"]+)".*/\1/p')"
          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Unable to detect the active Java version from 'java -version'."
            exit 1
          fi

          MAJOR_VERSION="${RAW_VERSION%%.*}"
          if [ "$MAJOR_VERSION" = "1" ]; then
            REMAINDER="${RAW_VERSION#1.}"
            MAJOR_VERSION="${REMAINDER%%.*}"
          fi
          MAJOR_VERSION="${MAJOR_VERSION%%-*}"
          MAJOR_VERSION="${MAJOR_VERSION%%_*}"

          if ! printf '%s' "$MAJOR_VERSION" | grep -Eq '^[0-9]+$'; then
            echo "::error::Could not parse numeric Java major version from '${RAW_VERSION}'."
            exit 1
          fi

          echo "Detected Java major version: ${MAJOR_VERSION}"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java ${MAJOR_VERSION}."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          KEYTOOL_BIN="${JAVA_HOME:-}/bin/keytool"
          if [ ! -x "$KEYTOOL_BIN" ]; then
            echo "::error::keytool executable not found under configured JAVA_HOME (${JAVA_HOME:-<unset>})."
            exit 1
          fi

          if [ ! -f "./debug.keystore" ]; then
            "$KEYTOOL_BIN" -genkeypair \
              -keystore "./debug.keystore" \
              -storepass "android" \
              -alias "androiddebugkey" \
              -keypass "android" \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg "RSA" \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          else
            echo "Temporary debug.keystore already present; skipping generation."
          fi

          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Verified temporary debug.keystore is present for debug signing."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at ${EXPECTED_APK}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find "app/build/outputs/apk" -type f -name '*.apk' -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::${EXPECTED_APK} is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::${EXPECTED_APK} is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "::error::${EXPECTED_APK} does not have the .apk extension."
              exit 1
              ;;
          esac

          APK_BYTES="$(wc -c < "$EXPECTED_APK" | tr -d ' ')"
          echo "Verified debug APK: ${EXPECTED_APK} (${APK_BYTES} bytes)"

      - name: Upload debug APK artifact
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ] || [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Verified APK missing at ${EXPECTED_APK}."
            exit 1
          fi

          RAW_REPO="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO="$(printf '%s' "$RAW_REPO" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$SAFE_REPO" ]; then
            SAFE_REPO="android-app"
          fi

          RELEASE_ASSET_DIR="$(mktemp -d "${RUNNER_TEMP}/release-asset.XXXXXX")"
          RELEASE_ASSET_NAME="${SAFE_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_ASSET_PATH="${RELEASE_ASSET_DIR}/${RELEASE_ASSET_NAME}"

          cp "$EXPECTED_APK" "$RELEASE_ASSET_PATH"

          if [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "::error::Prepared release asset missing or empty at ${RELEASE_ASSET_PATH}."
            exit 1
          fi

          case "$RELEASE_ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::error::Prepared release asset does not preserve .apk extension."
              exit 1
              ;;
          esac

          {
            echo "asset_path=${RELEASE_ASSET_PATH}"
            echo "asset_name=${RELEASE_ASSET_NAME}"
          } >> "$GITHUB_OUTPUT"
          echo "Prepared release asset filename: ${RELEASE_ASSET_NAME}"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared release asset is missing or empty; skipping release creation."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::error::Prepared release asset must be an .apk file."
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.md"

          cat > "$NOTES_FILE" <<EOF
          Automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number**: ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt**: ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA**: ${GITHUB_SHA}
          - **Release Asset**: ${ASSET_NAME}

          > **Notice**: This APK is intended for testing only. It is signed solely with a temporary debug keystore and is **not** a Play Store production release.
          EOF

          {
            echo "release_tag=${RELEASE_TAG}"
            echo "release_title=${RELEASE_TITLE}"
          } >> "$GITHUB_OUTPUT"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${GITHUB_SHA}" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          UPLOAD_OUTCOME="${{ steps.upload_apk.outcome }}"
          RELEASE_OUTCOME="${{ steps.create_release.outcome }}"
          RELEASE_TAG="${{ steps.create_release.outputs.release_tag }}"
          RELEASE_TITLE="${{ steps.create_release.outputs.release_title }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
            CONFIRMED_TITLE="$(gh release view "$RELEASE_TAG" --json name --jq '.name')"
            CONFIRMED_ASSET="$(gh release view "$RELEASE_TAG" --json assets --jq --arg expected "$ASSET_NAME" '(.assets[] | select(.name == $expected) | .name) // .assets[0].name // ""')"

            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${CONFIRMED_TITLE:-$RELEASE_TITLE}"
            echo "GitHub Release URL: ${RELEASE_URL}"
            echo "Release Asset Filename: ${CONFIRMED_ASSET:-$ASSET_NAME}"

            {
              echo "### Debug APK Build & Release Summary"
              echo ""
              echo "- **Status**: APK build, artifact upload (\`app-debug-apk\`), and GitHub Release publishing succeeded."
              echo "- **Release Tag**: \`${RELEASE_TAG}\`"
              echo "- **Release Title**: ${CONFIRMED_TITLE:-$RELEASE_TITLE}"
              echo "- **APK Asset Filename**: \`${CONFIRMED_ASSET:-$ASSET_NAME}\`"
              echo "- **Direct GitHub Release URL**: ${RELEASE_URL}"
              echo ""
              echo "You can download \`${CONFIRMED_ASSET:-$ASSET_NAME}\` directly from the **Assets** section on the GitHub Release page above. The GitHub Actions artifact \`app-debug-apk\` is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$UPLOAD_OUTCOME" = "success" ]; then
            echo "::warning::GitHub Release publishing failed, but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
            {
              echo "### Debug APK Build & Release Summary"
              echo ""
              echo "> **Warning**: Publishing to GitHub Releases failed, so no release URL was published."
              echo ""
              echo "- **APK Build**: Succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)"
              echo "- **Backup Download**: Download the \`app-debug-apk\` artifact from this GitHub Actions workflow run's **Artifacts** section."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::The APK build or artifact upload did not complete before release publishing."
            {
              echo "### Debug APK Build & Release Summary"
              echo ""
              echo "- **Status**: APK build or artifact upload failed; release publishing did not run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
