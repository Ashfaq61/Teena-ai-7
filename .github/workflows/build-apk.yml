name: Build and Publish APK

on:
  push:
    branches:
      - main
      - 'teena-tool/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-apk:
    name: Test, Sign & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          JAVA_VER_OUTPUT="$(java -version 2>&1)"
          echo "$JAVA_VER_OUTPUT"

          RAW_VERSION="$(printf '%s\n' "$JAVA_VER_OUTPUT" | head -n 1 | sed -nE 's/.*version "([^"]+)".*/\1/p')"
          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Unable to detect the active Java version from 'java -version'."
            exit 1
          fi

          MAJOR_VERSION="${RAW_VERSION%%.*}"
          if [ "$MAJOR_VERSION" = "1" ]; then
            REMAINDER="${RAW_VERSION#1.}"
            MAJOR_VERSION="${REMAINDER%%.*}"
          fi
          MAJOR_VERSION="${MAJOR_VERSION%%-*}"
          MAJOR_VERSION="${MAJOR_VERSION%%_*}"

          if ! printf '%s' "$MAJOR_VERSION" | grep -Eq '^[0-9]+$'; then
            echo "::error::Could not parse numeric Java major version from '${RAW_VERSION}'."
            exit 1
          fi

          echo "Detected Java major version: ${MAJOR_VERSION}"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java ${MAJOR_VERSION}."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure APK signing (TEENA_KEYSTORE or temporary debug key)
        env:
          TEENA_KEYSTORE_B64: ${{ secrets.TEENA_KEYSTORE }}
          TEENA_KEYSTORE_ALT_B64: ${{ secrets.TEENA_KEYSTORE_BASE64 }}
          TEENA_KEYSTORE_PASS: ${{ secrets.TEENA_KEYSTORE_PASSWORD }}
          TEENA_KEY_PASS: ${{ secrets.TEENA_KEY_PASSWORD }}
          TEENA_KEY_ALIAS_SECRET: ${{ secrets.TEENA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYTOOL_BIN="${JAVA_HOME:-}/bin/keytool"
          if [ ! -x "$KEYTOOL_BIN" ]; then
            echo "::error::keytool executable not found under configured JAVA_HOME (${JAVA_HOME:-<unset>})."
            exit 1
          fi

          EFFECTIVE_B64="${TEENA_KEYSTORE_B64:-${TEENA_KEYSTORE_ALT_B64:-}}"
          if [ -n "$EFFECTIVE_B64" ] && [ -n "$TEENA_KEYSTORE_PASS" ] && [ -n "$TEENA_KEY_PASS" ]; then
            RELEASE_KEYSTORE_PATH="${RUNNER_TEMP}/teena-release-keystore.jks"
            printf '%s' "$EFFECTIVE_B64" | tr -d '\r\n ' | base64 -d > "$RELEASE_KEYSTORE_PATH"

            if [ ! -s "$RELEASE_KEYSTORE_PATH" ]; then
              echo "::error::Decoded TEENA_KEYSTORE is empty."
              exit 1
            fi

            # app/build.gradle.kts release signingConfig expects keyAlias "upload".
            # If the provided keystore uses another alias, remap it in the temporary runner copy.
            EXISTING_ALIASES="$("$KEYTOOL_BIN" -list -keystore "$RELEASE_KEYSTORE_PATH" -storepass "$TEENA_KEYSTORE_PASS" 2>/dev/null | sed -nE 's/^([^,]+), [0-9]{4}.*/\1/p' || true)"
            if ! printf '%s\n' "$EXISTING_ALIASES" | grep -Fxq "upload"; then
              SOURCE_ALIAS="${TEENA_KEY_ALIAS_SECRET:-$(printf '%s\n' "$EXISTING_ALIASES" | head -n 1)}"
              if [ -n "$SOURCE_ALIAS" ]; then
                "$KEYTOOL_BIN" -changealias \
                  -alias "$SOURCE_ALIAS" \
                  -destalias "upload" \
                  -keystore "$RELEASE_KEYSTORE_PATH" \
                  -storepass "$TEENA_KEYSTORE_PASS" \
                  -keypass "$TEENA_KEY_PASS"
              fi
            fi

            # Also keep debug.keystore available for Gradle unit/variant evaluation
            if [ ! -f "./debug.keystore" ]; then
              "$KEYTOOL_BIN" -genkeypair \
                -keystore "./debug.keystore" \
                -storepass "android" \
                -alias "androiddebugkey" \
                -keypass "android" \
                -dname "CN=Android Debug,O=Android,C=US" \
                -keyalg "RSA" \
                -keysize 2048 \
                -validity 10000 \
                -noprompt
            fi

            {
              echo "KEYSTORE_PATH=${RELEASE_KEYSTORE_PATH}"
              echo "STORE_PASSWORD=${TEENA_KEYSTORE_PASS}"
              echo "KEY_PASSWORD=${TEENA_KEY_PASS}"
              echo "SIGNING_MODE=TEENA_KEYSTORE_RELEASE"
              echo "SIGNING_LABEL=SIGNED_RELEASE (TEENA_KEYSTORE)"
              echo "APK_GRADLE_TASK=:app:assembleRelease"
              echo "EXPECTED_APK=app/build/outputs/apk/release/app-release.apk"
              echo "ASSET_VARIANT=signed-release"
            } >> "$GITHUB_ENV"
            echo "Configured signed RELEASE APK build using TEENA_KEYSTORE secrets."
          else
            if [ ! -f "./debug.keystore" ]; then
              "$KEYTOOL_BIN" -genkeypair \
                -keystore "./debug.keystore" \
                -storepass "android" \
                -alias "androiddebugkey" \
                -keypass "android" \
                -dname "CN=Android Debug,O=Android,C=US" \
                -keyalg "RSA" \
                -keysize 2048 \
                -validity 10000 \
                -noprompt
            fi

            {
              echo "SIGNING_MODE=TEMPORARY_DEBUG_KEY"
              echo "SIGNING_LABEL=TEMPORARY_KEY (Testing Only - TEENA_KEYSTORE secrets not configured)"
              echo "APK_GRADLE_TASK=:app:assembleDebug"
              echo "EXPECTED_APK=app/build/outputs/apk/debug/app-debug.apk"
              echo "ASSET_VARIANT=temporary-key-debug"
            } >> "$GITHUB_ENV"
            echo "TEENA_KEYSTORE secrets absent; configured TEMPORARY_KEY debug APK build."
          fi

      - name: Run unit & Robolectric tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Build APK
        run: gradle "$APK_GRADLE_TASK" --stacktrace --no-daemon

      - name: Verify built APK
        run: |
          set -euo pipefail
          if [ ! -f "$EXPECTED_APK" ] || [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Expected APK not found or empty at ${EXPECTED_APK}."
            find "app/build/outputs/apk" -type f -name '*.apk' -print 2>/dev/null || true
            exit 1
          fi

          APK_BYTES="$(wc -c < "$EXPECTED_APK" | tr -d ' ')"
          echo "Verified APK (${SIGNING_LABEL}): ${EXPECTED_APK} (${APK_BYTES} bytes)"

      - name: Upload APK artifact
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: teena-apk-artifact
          path: ${{ env.EXPECTED_APK }}
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          if [ ! -f "$EXPECTED_APK" ] || [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Verified APK missing at ${EXPECTED_APK}."
            exit 1
          fi

          RAW_REPO="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO="$(printf '%s' "$RAW_REPO" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$SAFE_REPO" ]; then
            SAFE_REPO="teena-ai"
          fi

          RELEASE_ASSET_DIR="$(mktemp -d "${RUNNER_TEMP}/release-asset.XXXXXX")"
          RELEASE_ASSET_NAME="${SAFE_REPO}-${ASSET_VARIANT}-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_ASSET_PATH="${RELEASE_ASSET_DIR}/${RELEASE_ASSET_NAME}"

          cp "$EXPECTED_APK" "$RELEASE_ASSET_PATH"

          if [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "::error::Prepared release asset missing or empty at ${RELEASE_ASSET_PATH}."
            exit 1
          fi

          {
            echo "asset_path=${RELEASE_ASSET_PATH}"
            echo "asset_name=${RELEASE_ASSET_NAME}"
          } >> "$GITHUB_OUTPUT"
          echo "Prepared release asset filename: ${RELEASE_ASSET_NAME}"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared release asset is missing or empty; skipping release creation."
            exit 1
          fi

          RELEASE_TAG="${ASSET_VARIANT}-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TAG="$(printf '%s' "$RELEASE_TAG" | tr -d '[:space:]')"
          RELEASE_TITLE="Teena AI APK #${GITHUB_RUN_NUMBER} [${SIGNING_MODE}]"
          NOTES_FILE="${RUNNER_TEMP}/release-notes-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.md"

          cat > "$NOTES_FILE" <<EOF
          Automated Android build from GitHub Actions (\`${GITHUB_REF_NAME}\`).

          - **Signing Status**: ${SIGNING_LABEL}
          - **Unit Tests**: Passed (\`:app:testDebugUnitTest\`)
          - **Workflow Run Number**: ${GITHUB_RUN_NUMBER}
          - **Source Commit SHA**: ${GITHUB_SHA}
          - **Release Asset**: ${ASSET_NAME}
          EOF

          {
            echo "release_tag=${RELEASE_TAG}"
            echo "release_title=${RELEASE_TITLE}"
          } >> "$GITHUB_OUTPUT"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${GITHUB_SHA}" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Report APK download result
        id: report_release
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          UPLOAD_OUTCOME="${{ steps.upload_apk.outcome }}"
          RELEASE_OUTCOME="${{ steps.create_release.outcome }}"
          RAW_TAG="${{ steps.create_release.outputs.release_tag }}"
          RELEASE_TAG="$(printf '%s' "$RAW_TAG" | tr -d '[:space:]')"
          RELEASE_TITLE="${{ steps.create_release.outputs.release_title }}"
          RAW_ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          ASSET_NAME="$(printf '%s' "$RAW_ASSET_NAME" | tr ' ' '-')"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            if [ -z "$RELEASE_TAG" ]; then
              echo "::warning::Release succeeded but release_tag output is empty."
              exit 1
            fi

            VIEW_ERR_FILE="${RUNNER_TEMP}/gh-release-view.err"
            if ! RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url' 2>"$VIEW_ERR_FILE")"; then
              echo "::warning::gh release view failed while reading release URL for tag '${RELEASE_TAG}':"
              cat "$VIEW_ERR_FILE" >&2 || true
              exit 1
            fi

            if ! CONFIRMED_TITLE="$(gh release view "$RELEASE_TAG" --json name --jq '.name' 2>"$VIEW_ERR_FILE")"; then
              echo "::warning::gh release view failed while reading release title for tag '${RELEASE_TAG}':"
              cat "$VIEW_ERR_FILE" >&2 || true
              CONFIRMED_TITLE="$RELEASE_TITLE"
            fi

            if ! ALL_ASSETS="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' 2>"$VIEW_ERR_FILE")"; then
              echo "::warning::gh release view failed while reading release assets for tag '${RELEASE_TAG}':"
              cat "$VIEW_ERR_FILE" >&2 || true
              ALL_ASSETS=""
            fi

            CONFIRMED_ASSET="$(printf '%s\n' "$ALL_ASSETS" | grep -Fx -- "$ASSET_NAME" | head -n 1 || true)"
            if [ -z "$CONFIRMED_ASSET" ]; then
              CONFIRMED_ASSET="$(printf '%s\n' "$ALL_ASSETS" | head -n 1 || true)"
            fi
            if [ -z "$CONFIRMED_ASSET" ]; then
              CONFIRMED_ASSET="$ASSET_NAME"
            fi

            echo "Signing Mode: ${SIGNING_LABEL}"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${CONFIRMED_TITLE:-$RELEASE_TITLE}"
            echo "GitHub Release URL: ${RELEASE_URL}"
            echo "Release Asset Filename: ${CONFIRMED_ASSET}"

            {
              echo "### Teena AI APK Build & Release Summary"
              echo ""
              echo "- **Signing Status**: ${SIGNING_LABEL}"
              echo "- **Unit Tests**: Passed (\`:app:testDebugUnitTest\`)"
              echo "- **Release Tag**: \`${RELEASE_TAG}\`"
              echo "- **Release Title**: ${CONFIRMED_TITLE:-$RELEASE_TITLE}"
              echo "- **APK Asset Filename**: \`${CONFIRMED_ASSET}\`"
              echo "- **Direct GitHub Release URL**: ${RELEASE_URL}"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$UPLOAD_OUTCOME" = "success" ]; then
            echo "::warning::GitHub Release publishing failed; APK artifact 'teena-apk-artifact' (${SIGNING_LABEL}) remains available."
            {
              echo "### Teena AI APK Build Summary"
              echo ""
              echo "> **Warning**: GitHub Release publishing failed, so no release URL was published."
              echo ""
              echo "- **Signing Status**: ${SIGNING_LABEL}"
              echo "- **APK Path**: \`${EXPECTED_APK}\`"
              echo "- **Backup Download**: Download \`teena-apk-artifact\` from Workflow Artifacts."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::APK build or artifact upload did not complete."
          fi
